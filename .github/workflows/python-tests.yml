name: Mortgage Engine Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-suite:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Architecture Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pydantic pandas openpyxl xlsxwriter requests python-dateutil python-dotenv

    - name: Execute Core Test Matrices
      run: |
        python -m Testing.mortgage_testing
